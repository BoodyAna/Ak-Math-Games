<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fractions Challenge — AK Math Games</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game">
      <header class="hud">
        <div class="hud-stat">
          <span class="hud-label">Score</span>
          <span class="hud-value" id="score">0</span>
        </div>
        <div class="hud-stat">
          <span class="hud-label">Round</span>
          <span class="hud-value" id="round">1 / 8</span>
        </div>
        <div class="hud-stat">
          <span class="hud-label">Streak</span>
          <span class="hud-value" id="streak">0</span>
        </div>
      </header>

      <section class="prompt-panel">
        <p class="prompt" id="prompt">Which slice is bigger?</p>
      </section>

      <section class="pizza-row" id="pizzaRow"></section>

      <p class="feedback" id="feedback"></p>

      <div class="overlay" id="startOverlay">
        <div class="overlay-card">
          <h1>🍕 Fractions Challenge</h1>
          <p>Compare pizza slices to build your sense of fractions — pick the bigger (or matching) portion each round.</p>
          <button id="startBtn" class="btn">Start Slicing</button>
        </div>
      </div>

      <div class="overlay hidden" id="endOverlay">
        <div class="overlay-card">
          <h1>🎉 Nice Work!</h1>
          <p id="finalScore">Score: 0</p>
          <button id="restartBtn" class="btn">Play Again</button>
        </div>
      </div>
    </main>
    <script src="game.js"></script>
  </body>
</html>
